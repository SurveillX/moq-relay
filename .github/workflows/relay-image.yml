name: build-relay-image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest   # amd64 — native build of the Nix Dockerfile (no qemu)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            package=moq-relay
          tags: |
            ghcr.io/surveillx/moq-relay:${{ github.sha }}
            ghcr.io/surveillx/moq-relay:phase-c
          push: true
